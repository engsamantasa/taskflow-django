{% extends 'base.html' %}

{% block content %}




<div class="container py-5" style="max-width:600px">

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">

            <p class="text-muted small">
                Conta criada em {{ request.user.date_joined|date:"d/m/Y" }}
            </p>

            <h3 class="fw-bold mb-4"> Atualizando o perfil: </h3>

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Nome</label>
                    {{ form.first_name }}
                </div>

                <div class="mb-3">
                    <label>Sobrenome</label>
                    {{ form.last_name }}
                </div>

                <div class="mb-3">
                    <label>Username</label>
                    {{ form.username }}
                </div>

                <div class="mb-4">
                    <label>Email</label>
                    {{ form.email }}
                </div>

                <button class="btn btn-primary w-100">
                    Salvar Alterações
                </button>
            </form>

        </div>
    </div>

</div>
{% endblock %}
